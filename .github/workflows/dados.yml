name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dias:
        description: Janela em dias (1 a 60); a coleta do PNCP leva cerca de 2,5 min por dia de janela
        type: number
        default: 30

permissions: {}

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun scripts/dados/red-flags.ts
        env:
          DIAS: ${{ inputs.dias || '30' }}
      - run: bun scripts/dados/validar.ts red-flags
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-contratos
          path: public/data/red-flags.json
          if-no-files-found: error
          retention-days: 30

  obras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/dados/obras.ts
      - run: bun scripts/dados/validar.ts obras
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-obras
          path: public/data/obras.json
          if-no-files-found: error
          retention-days: 30

  gastos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun scripts/dados/gastos.ts
      - run: bun scripts/dados/validar.ts gastos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-gastos
          path: |
            public/data/gastos.json
            public/data/gastos-resumo.json
          if-no-files-found: error
          retention-days: 30

  gastos-corrente:
    # Depois do ano fechado, para não somar duas coletas simultâneas contra a mesma API.
    needs: gastos
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun scripts/dados/gastos.ts corrente
      - run: bun scripts/dados/validar.ts gastos-corrente
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-gastos-corrente
          path: public/data/gastos-corrente.json
          if-no-files-found: ignore
          retention-days: 30

  publicar:
    needs: [contratos, obras, gastos, gastos-corrente]
    # Publica o que deu certo; a fonte que falhou continua visível como job vermelho.
    # Disparo manual em outra branch não pode levar código para a main como se fosse atualização de dados.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && (needs.contratos.result == 'success' || needs.obras.result == 'success' || needs.gastos.result == 'success' || needs.gastos-corrente.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      mesclado: ${{ steps.mesclar.outputs.mesclado }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dados-*
          merge-multiple: true
          path: public/data
      - name: Conferir os arquivos baixados
        run: |
          # Só estes arquivos podem ir para produção; o job de coleta roda dependências de terceiros e não é confiável.
          permitidos=" red-flags.json obras.json gastos.json gastos-resumo.json gastos-corrente.json "
          git status --porcelain -uall -- public/data | while read -r _ arq; do
            nome="${arq#public/data/}"
            case "$permitidos" in *" $nome "*) ;; *) echo "::error::Arquivo inesperado: $arq"; exit 1 ;; esac
          done
          # Repete a validação aqui: a feita no job de coleta não vale para o que chegou por artefato.
          for alvo in red-flags obras gastos gastos-corrente; do
            if [ -n "$(git status --porcelain -- "public/data/$alvo.json")" ]; then
              bun scripts/dados/validar.ts "$alvo"
            fi
          done
      - name: Abrir PR com os dados
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTADO_CONTRATOS: ${{ needs.contratos.result }}
          RESULTADO_OBRAS: ${{ needs.obras.result }}
          RESULTADO_GASTOS: ${{ needs.gastos.result }}
          RESULTADO_CORRENTE: ${{ needs.gastos-corrente.result }}
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then exit 0; fi
          # Só resume fonte que teve sucesso nesta execução; o arquivo das demais é o antigo da main.
          linha() {
            if [ "$2" != "success" ]; then echo "- $1: não atualizado nesta execução ($2)"; return; fi
            jq -er --argjson antes "${ANTES:-0}" "$4" "$3" || echo "- $1: resumo indisponível"
          }
          ANTES=$(git show HEAD:public/data/gastos.json 2>/dev/null | jq -r '.municipios|length' 2>/dev/null || echo 0)
          resumo=$(
            echo "Dados gerados pelo workflow Atualizar dados: $RUN_URL (commit $GITHUB_SHA)."
            echo
            linha Contratos "$RESULTADO_CONTRATOS" public/data/red-flags.json \
              '"- Contratos: \(.analisados|numbers) analisados em \(.janelaDias|numbers) dias, \(.alertasTotal|numbers) alertas detectados, \(.alertas|length) publicados (CNPJ: \(.cnpjConsultados|numbers) consultados, \(.cnpjCortados|numbers) sem checagem, \(.cnpjFalhas|numbers) falhas)"'
            linha Obras "$RESULTADO_OBRAS" public/data/obras.json \
              '"- Obras: \(.obras|length) registros, UFs com falha: \(.ufsComFalha|length)"'
            linha Gastos "$RESULTADO_GASTOS" public/data/gastos.json \
              '"- Gastos: exercício \(.exercicio|numbers), \(.cobertura.publicados|numbers) de \(.cobertura.universo|numbers) municípios (antes: \($antes)), \(.cobertura.semPessoal|numbers) sem dados de pessoal"'
            # O arquivo da main continua no checkout; só vale como resumo se esta execução o alterou.
            if [ "$RESULTADO_CORRENTE" = "success" ] && [ -n "$(git status --porcelain -- public/data/gastos-corrente.json)" ]; then
              linha "Gastos do ano corrente" "$RESULTADO_CORRENTE" public/data/gastos-corrente.json \
                '"- Gastos \(.exercicio|numbers) (parcial): \(.cobertura.publicados|numbers) de \(.cobertura.universo|numbers) municípios, até o \(.cobertura.bimestreMax|numbers)º bimestre"'
            else
              echo "- Gastos do ano corrente: não atualizado nesta execução ($RESULTADO_CORRENTE)"
            fi
            echo
            echo "Mesclado sozinho quando a variação passa na checagem de sanidade (scripts/dados/sanidade.ts); caso contrário, fica aberto para conferência."
          )
          ramo="dados/auto-$RUN_ID-$RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$ramo"
          git add public/data
          git commit -m "Update public data (run $RUN_ID)"
          git push origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "Update public data (run $RUN_ID)" \
            --body "$resumo"
          echo "ramo=$ramo" >> "$GITHUB_ENV"
          # Dados novos substituem os de PRs anteriores que ficaram abertos (sanidade reprovada ou nova tentativa).
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"dados/auto-\")) | select(.headRefName != \"$ramo\") | .number" |
            while read -r n; do
              gh pr close "$n" --delete-branch --comment "Substituído pela coleta mais recente (branch $ramo)."
            done
      - name: Mesclar se a variação for normal
        id: mesclar
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: FETCH_HEAD
        run: |
          if [ -z "$ramo" ]; then exit 0; fi
          # A coleta leva horas; compara com a main de agora, não com a do disparo.
          git fetch -q --depth=1 origin main
          # O PR só pode conter dados.
          if git diff --name-only HEAD~1 HEAD | grep -qv '^public/data/'; then
            echo "::error::O commit de dados altera arquivos fora de public/data"; exit 1
          fi
          # Variação fora do normal: o PR fica aberto, com o motivo registrado, e a execução fica vermelha.
          if saida=$(bun scripts/dados/sanidade.ts 2>&1); then
            printf 'Mesclado automaticamente pela checagem de sanidade (scripts/dados/sanidade.ts, commit %s).\n\n%s\n' "$GITHUB_SHA" "$saida" | gh pr comment "$ramo" --body-file -
          else
            echo "$saida"
            printf 'Não mesclado: a variação fugiu do esperado. Conferir antes de mesclar.\n\n%s\n' "$saida" | gh pr comment "$ramo" --body-file -
            exit 1
          fi
          gh pr merge "$ramo" --squash --match-head-commit "$(git rev-parse HEAD)"
          echo "mesclado=true" >> "$GITHUB_OUTPUT"
          git push origin --delete "$ramo" || echo "::warning::Não foi possível apagar a branch $ramo"

  implantar:
    needs: publicar
    if: ${{ needs.publicar.outputs.mesclado == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Merge feito com o token do Actions não dispara o deploy; ele é chamado à mão, num job só com este escopo.
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main
