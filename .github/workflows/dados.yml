name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dias:
        description: Janela em dias (1 a 60); a coleta do PNCP leva cerca de 2,5 min por dia de janela
        type: number
        default: 30

permissions: {}

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun scripts/dados/red-flags.ts
        env:
          DIAS: ${{ inputs.dias || '30' }}
      - run: bun scripts/dados/validar.ts red-flags
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-contratos
          path: public/data/red-flags.json
          if-no-files-found: error
          retention-days: 30

  obras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/dados/obras.ts
      - run: bun scripts/dados/validar.ts obras
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-obras
          path: public/data/obras.json
          if-no-files-found: error
          retention-days: 30

  gastos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun scripts/dados/gastos.ts
      - run: bun scripts/dados/validar.ts gastos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-gastos
          path: |
            public/data/gastos.json
            public/data/gastos-resumo.json
          if-no-files-found: error
          retention-days: 30

  publicar:
    needs: [contratos, obras, gastos]
    # Publica o que deu certo; a fonte que falhou continua visível como job vermelho.
    if: ${{ !cancelled() && (needs.contratos.result == 'success' || needs.obras.result == 'success' || needs.gastos.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dados-*
          merge-multiple: true
          path: public/data
      - name: Abrir PR com os dados
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTADO_CONTRATOS: ${{ needs.contratos.result }}
          RESULTADO_OBRAS: ${{ needs.obras.result }}
          RESULTADO_GASTOS: ${{ needs.gastos.result }}
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then exit 0; fi
          # Só resume fonte que teve sucesso nesta execução; o arquivo das demais é o antigo da main.
          linha() {
            if [ "$2" != "success" ]; then echo "- $1: não atualizado nesta execução ($2)"; return; fi
            jq -er --argjson antes "${ANTES:-0}" "$4" "$3" || echo "- $1: resumo indisponível"
          }
          ANTES=$(git show HEAD:public/data/gastos.json 2>/dev/null | jq -r '.municipios|length' 2>/dev/null || echo 0)
          resumo=$(
            echo "Dados gerados pelo workflow Atualizar dados: $RUN_URL (commit $GITHUB_SHA)."
            echo
            linha Contratos "$RESULTADO_CONTRATOS" public/data/red-flags.json \
              '"- Contratos: \(.analisados|numbers) analisados em \(.janelaDias|numbers) dias, \(.alertasTotal|numbers) alertas detectados, \(.alertas|length) publicados (CNPJ: \(.cnpjConsultados|numbers) consultados, \(.cnpjCortados|numbers) sem checagem, \(.cnpjFalhas|numbers) falhas)"'
            linha Obras "$RESULTADO_OBRAS" public/data/obras.json \
              '"- Obras: \(.obras|length) registros, UFs com falha: \(.ufsComFalha|length)"'
            linha Gastos "$RESULTADO_GASTOS" public/data/gastos.json \
              '"- Gastos: exercício \(.exercicio|numbers), \(.cobertura.publicados|numbers) de \(.cobertura.universo|numbers) municípios (antes: \($antes)), \(.cobertura.semPessoal|numbers) sem dados de pessoal"'
            echo
            echo "Conferir os arquivos em public/data antes de aprovar."
          )
          ramo="dados/auto-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$ramo"
          git add public/data
          git commit -m "Update public data (run $RUN_ID)"
          git push origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "Update public data (run $RUN_ID)" \
            --body "$resumo"
