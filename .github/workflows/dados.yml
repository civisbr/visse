name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dias:
        description: Janela em dias (1 a 60)
        type: number
        default: 14

permissions: {}

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun scripts/dados/red-flags.ts
        env:
          DIAS: ${{ inputs.dias || '14' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-contratos
          path: public/data/red-flags.json
          if-no-files-found: error
          retention-days: 7

  obras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/dados/obras.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dados-obras
          path: public/data/obras.json
          if-no-files-found: error
          retention-days: 7

  publicar:
    needs: [contratos, obras]
    # Publica o que deu certo; a fonte que falhou continua visível como job vermelho.
    if: ${{ !cancelled() && (needs.contratos.result == 'success' || needs.obras.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dados-*
          merge-multiple: true
          path: public/data
      - name: Abrir PR com os dados
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain -- public/data)" ]; then exit 0; fi
          ramo="dados/auto-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$ramo"
          git add public/data
          git commit -m "Update public data (run $RUN_ID)"
          git push origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "Update public data (run $RUN_ID)" \
            --body "Dados gerados pelo workflow Atualizar dados, execução $RUN_ID. Conferir os arquivos em public/data antes de aprovar."
